name: Backup diario de la BD (DermaLand)

# Mitigación B-01 (validación de producción): backup lógico diario mientras el
# proyecto Supabase no tenga backups automáticos/PITR (plan Free).
#
# REQUISITOS (Settings → Secrets and variables → Actions → New repository secret):
#   - SUPABASE_DB_URL         (obligatorio) connection string URI de la BD.
#                             Dashboard Supabase → Settings → Database → Connection
#                             string → URI (modo Session pooler).
#   - BACKUP_GPG_PASSPHRASE   (opcional, RECOMENDADO) si se define, el dump se cifra
#                             con GPG simétrico antes de subirse (el artifact
#                             contiene datos personales de clientes).
#
# El backup queda como "artifact" del run (retención 14 días). Para retención larga
# o almacenamiento externo (S3/Backblaze/NAS), añadir un paso de subida aquí.

on:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC = 03:00 República Dominicana
  workflow_dispatch: {} # permite correrlo a mano desde la pestaña Actions

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # La passphrase se declara a nivel de JOB, no de paso. Un `if:` que consulta
    # una variable definida en su propio paso no es fiable en GitHub Actions, y
    # el modo de fallo aquí es silencioso y grave: el artefacto se subiría SIN
    # cifrar, con nombres, cédulas y teléfonos de clientes dentro.
    env:
      BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar cliente de PostgreSQL 17 (pg_dump debe ser >= version del servidor)
        # El paquete `postgresql-client` de los repos de Ubuntu trae la v16, pero
        # producción corre PostgreSQL 17.6. pg_dump se niega a volcar un servidor
        # de version mayor a la suya ("aborting because of server version mismatch"),
        # asi que hace falta el repositorio oficial PGDG para instalar la v17.
        run: |
          sudo apt-get install -y curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | \
            sudo gpg --dearmor -o /usr/share/keyrings/postgresql-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql-keyring.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | \
            sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar secreto de conexión
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "::error::Falta el secreto SUPABASE_DB_URL. Configúralo en Settings → Secrets → Actions."
            exit 1
          fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Ejecutar backup (pg_dump, solo lectura)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/backup/pg-dump-backup.mjs --label ci-$(date -u +%Y%m%d-%H%M)

      # El cifrado NO es opcional. El dump lleva nombres, cédulas y teléfonos de
      # clientes reales: sin passphrase, el trabajo se detiene aquí en vez de
      # producir un artefacto con datos personales en claro.
      - name: Cifrar backup (obligatorio)
        run: |
          if [ -z "${BACKUP_GPG_PASSPHRASE}" ]; then
            echo "::error::Falta el secreto BACKUP_GPG_PASSPHRASE. El respaldo contiene"
            echo "::error::datos personales de clientes y no se sube sin cifrar."
            exit 1
          fi
          for f in backups/*.sql.gz; do
            gpg --batch --yes --passphrase "$BACKUP_GPG_PASSPHRASE" \
              --symmetric --cipher-algo AES256 "$f"
            rm -f "$f"   # deja solo el .gpg cifrado
          done
          # Red de seguridad: si quedó algún .sql.gz sin cifrar, abortar.
          if ls backups/*.sql.gz >/dev/null 2>&1; then
            echo "::error::Quedaron dumps sin cifrar. Abortando antes de subir nada."
            exit 1
          fi

      - name: Subir backup como artifact
        uses: actions/upload-artifact@v4
        with:
          name: dermaland-db-backup
          # SOLO el cifrado. Nunca añadir aquí `backups/*.sql.gz`: bastaría un
          # fallo del paso anterior para publicar datos personales en claro.
          path: backups/*.sql.gz.gpg
          retention-days: 14
          if-no-files-found: error
